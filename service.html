          "Gestion complète de parc informatique : inventaire, maintenance préventive et corrective",
          "Solutions de sauvegarde et plan de reprise d'activité",
          "Déploiement automatisé avec Ansible et FOG (imagerie réseau)",
          "Supervision et monitoring (Nagios, Zabbix)",
          "Migration de serveurs et optimisation des performances",
          "Support utilisateurs de niveau 1 à 3"
        ],
        pourqui: "PME, associations, collectivités, établissements scolaires"
      },
      reseau: {
        icon: "fa-network-wired",
        title: "Réseaux & Sécurité",
        desc: "Cisco CCNA, Mikrotik, pfSense, Fortinet. Architecture réseau, VPN, QoS, pare-feu, segmentation.",
        full: [
          "Architecture et déploiement de réseaux d'entreprise (Cisco, Mikrotik, Ubiquiti)",
          "Configuration de pare-feu : pfSense, Fortinet, OPNsense",

        icon: "fa-laptop-code",

          "Création de sites vitrine et e-commerce sur mesure",

          "Formation individuelle ou en groupe aux outils informatiques",

          "Audit et diagnostic des systèmes existants"
        ],
        pourqui: "Toute organisation souhaitant monter en compétence"

    const params = new URLSearchParams(window.location.search);
    const slug = params.get('s') || 'admin';
    const svc = services[slug];

    if (svc) {
      document.title = "Joseph Moussallem — " + svc.title;
      let html = '<div class="detail-icon"><i class="fas ' + svc.icon + '"></i></div>';
      html += '<h1>' + svc.title + '</h1>';
      html += '<p class="detail-desc">' + svc.desc + '</p>';
      html += '<h2>Prestations détaillées</h2><ul>';
      svc.full.forEach(function(item) { html += '<li>' + item + '</li>'; });
      html += '</ul>';
      html += '<div class="detail-pourqui"><strong>Pour qui ?</strong> ' + svc.pourqui + '</div>';
      html += '<a href="index.html#contact" class="btn-primary"><i class="fas fa-paper-plane"></i> Demander un devis</a>';
      document.getElementById('detailCard').innerHTML = html;
    }
